# ─────────────────────────────────────────────────────────
# VyaparSathi — Nginx Reverse Proxy (Production / Alexa+)
# SSE-safe: disables buffering so Streamable HTTP / SSE
# responses stream correctly through to the client.
# ─────────────────────────────────────────────────────────

# ── Redirect HTTP → HTTPS ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge passthrough for Let's Encrypt renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ── HTTPS — Main Server ─────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # ── TLS Certificates ─────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ─────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Logging ──────────────────────────────────────────
    access_log /var/log/nginx/vyaparsathi_access.log;
    error_log  /var/log/nginx/vyaparsathi_error.log;

    # ── Health Endpoint (fast path, no upstream) ─────────
    location = /nginx-health {
        return 200 '{"status":"ok","proxy":"nginx"}';
        add_header Content-Type application/json;
    }

    # ── MCP Streamable HTTP Endpoint ─────────────────────
    # Critical for Alexa+ SSE: disable all response buffering
    # so that Server-Sent Events and streamed JSON arrive
    # immediately at the client without Nginx holding them.
    location /mcp {
        proxy_pass         http://vyaparsathi:8000;

        # HTTP/1.1 keep-alive to upstream (required for SSE)
        proxy_http_version 1.1;
        proxy_set_header   Connection '';

        # Disable Nginx response buffering entirely
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;

        # Long timeout for SSE streams (1 hour)
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 30s;

        # Forward real client info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable request buffering (for large tool payloads)
        proxy_request_buffering off;
    }

    # ── All Other Routes → FastAPI ───────────────────────
    location / {
        proxy_pass         http://vyaparsathi:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;
    }
}
